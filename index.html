<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <title></title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/rtl.css" />
  <link rel="alternate" hreflang="en" href="index.html?lang=en" />
  <link rel="alternate" hreflang="ar" href="index.html?lang=ar" />
  <link rel="alternate" hreflang="fa" href="index.html?lang=fa" />
  <link rel="alternate" hreflang="x-default" href="index.html?lang=en" />
  <script type="module" src="assets/js/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main-content" data-i18n="common.skipToContent"></a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" data-localized-link>
        <span data-i18n="common.siteName"></span>
      </a>
      <nav class="main-nav" data-i18n-aria-label="common.a11y.primaryNavigation">
        <ul>
          <li><a href="index.html" data-localized-link data-i18n="common.nav.home"></a></li>
          <li><a href="about.html" data-localized-link data-i18n="common.nav.about"></a></li>
          <li><a href="services.html" data-localized-link data-i18n="common.nav.services"></a></li>
          <li><a href="contact.html" data-localized-link data-i18n="common.nav.contact"></a></li>
        </ul>
      </nav>
      <div class="lang-switch lang-switch-desktop" role="group" data-i18n-aria-label="common.a11y.languageSwitcher">
        <button type="button" data-lang-switch="en" data-i18n="common.language.short.en" data-i18n-aria-label="common.language.switchToEn"></button>
        <button type="button" data-lang-switch="ar" data-i18n="common.language.short.ar" data-i18n-aria-label="common.language.switchToAr"></button>
        <button type="button" data-lang-switch="fa" data-i18n="common.language.short.fa" data-i18n-aria-label="common.language.switchToFa"></button>
      </div>
    </div>
    <div class="container lang-switch lang-switch-mobile" role="group" data-i18n-aria-label="common.a11y.languageSwitcherMobile">
      <button type="button" data-lang-switch="en" data-i18n="common.language.en"></button>
      <button type="button" data-lang-switch="ar" data-i18n="common.language.ar"></button>
      <button type="button" data-lang-switch="fa" data-i18n="common.language.fa"></button>
    </div>
  </header>

  <main id="main-content">
    <section class="hero section">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow" data-i18n="home.hero.eyebrow"></p>
          <h1 data-i18n="home.hero.title"></h1>
          <p class="lead" data-i18n="home.hero.description"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="services.html" data-localized-link data-i18n="home.hero.primaryCta"></a>
            <a class="button button-secondary" href="contact.html" data-localized-link data-i18n="home.hero.secondaryCta"></a>
          </div>
        </div>
        <div class="card highlight-card">
          <h2 data-i18n="home.highlight.title"></h2>
          <p data-i18n="home.highlight.description"></p>
        </div>
      </div>
    </section>

    <section class="section muted">
      <div class="container cards-grid">
        <article class="card">
          <h3 data-i18n="home.features.fast.title"></h3>
          <p data-i18n="home.features.fast.description"></p>
        </article>
        <article class="card">
          <h3 data-i18n="home.features.flexible.title"></h3>
          <p data-i18n="home.features.flexible.description"></p>
        </article>
        <article class="card">
          <h3 data-i18n="home.features.support.title"></h3>
          <p data-i18n="home.features.support.description"></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p data-i18n="common.footer.description"></p>
      <p><span data-i18n="common.footer.rights"></span> <span id="current-year"></span></p>
    </div>
  </footer>
</body>
</html>
